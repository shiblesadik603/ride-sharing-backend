name: ride-sharing-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ride_sharing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Explicit, not relying on the image's default: this Redis instance
    # backs BullMQ's job queues, not just disposable geo/rate-limit data —
    # losing a queued job (a verification email, a scheduled report) to
    # silent eviction under memory pressure would be a real correctness
    # bug, not a cache miss. `noeviction` makes Redis reject writes with a
    # loud OOM error instead of quietly dropping data once `maxmemory` is
    # reached — worse availability in that moment, but a failure you can
    # alert on beats silent data loss. 256mb is a generous ceiling for
    # this project's data (geo sets, rate-limit counters, queue payloads
    # measured in kilobytes each); raise it if BullMQ queues are ever
    # expected to hold a large backlog.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # HTTP API. Runs with ENABLE_JOBS=false — the `worker` service below
  # handles email/cleanup/report jobs instead, the split this compose
  # file exists to demonstrate (see src/worker.js's own comment for why).
  # A single-service deployment (Railway, Render) can just as validly
  # drop the `worker` service and set ENABLE_JOBS=true here instead —
  # both are supported, this file picks the split to actually show it.
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ride_sharing}?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_JOBS: "false"
      PORT: ${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ride_sharing}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
